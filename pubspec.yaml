name: coinsight
description: "Coinsight — Discover what your coins are really worth."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (plain Riverpod — no codegen required)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Platform / storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.0
  connectivity_plus: ^6.0.3

  # Sharing
  share_plus: ^10.0.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0
  logger: ^2.3.0
  uuid: ^4.4.0

  # ---------------------------------------------------------------------------
  # Backend (Firebase project: coinsights-eabc4) — kept behind service
  # abstractions in lib/services / lib/features/auth.
  # ---------------------------------------------------------------------------
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_analytics: ^11.3.5
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Subscriptions — RevenueCat.
  purchases_flutter: ^8.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true          # generates AppLocalizations from lib/l10n/*.arb
  assets:
    - assets/mock/
    - assets/brand/

# ─── App icon (run: dart run flutter_launcher_icons) ───────────────────────
flutter_launcher_icons:
  image_path: "assets/brand/icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#0B0D12"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#0B0D12"
    theme_color: "#0B0D12"

# ─── Native splash (run: dart run flutter_native_splash:create) ────────────
flutter_native_splash:
  color: "#0B0D12"
  image: "assets/brand/splash.png"
  android_12:
    image: "assets/brand/splash.png"
    color: "#0B0D12"
  ios: true
  web: false
