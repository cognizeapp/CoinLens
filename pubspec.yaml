name: coinsight
description: "Coinsight — Discover what your coins are really worth."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (plain Riverpod — no codegen required)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Platform / storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.0
  connectivity_plus: ^6.0.3

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  collection: ^1.18.0
  logger: ^2.3.0
  uuid: ^4.4.0

  # ---------------------------------------------------------------------------
  # Backend (Firebase) — kept behind service abstractions in lib/services.
  # Enable once a Firebase project is configured (see README "Connecting
  # Firebase"). The app runs fully on mock providers until then.
  # ---------------------------------------------------------------------------
  # firebase_core: ^3.1.0
  # firebase_auth: ^5.1.0
  # cloud_firestore: ^5.0.2
  # firebase_storage: ^12.0.1
  # firebase_analytics: ^11.1.0
  # firebase_crashlytics: ^4.0.2
  # google_sign_in: ^6.2.1
  # sign_in_with_apple: ^6.1.1

  # Subscriptions — wired in Phase 5.
  # purchases_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true          # generates AppLocalizations from lib/l10n/*.arb
  assets:
    - assets/mock/
