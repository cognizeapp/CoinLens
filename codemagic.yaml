# Codemagic CI/CD — Coinsights
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
#   • ios-release      → SIGNED .ipa, uploaded to App Store Connect / TestFlight
#   • ios-workflow     → unsigned .app  (fast PR check: analyze + test + compile)
#   • android-workflow → release .apk + .aab (debug-signed, for testing only)
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP for ios-release (~5 min):
#
# 1. App Store Connect → Users and Access → Integrations → App Store Connect API
#    → generate a TEAM key with the "App Manager" role (Admin also works;
#    "Developer" does NOT — it can't create certificates/profiles).
#    Download the .p8 once. Note the Issuer ID and the Key ID.
#
# 2. Codemagic → (top-right avatar) Team/Personal settings → Integrations →
#    App Store Connect → Connect. Paste Issuer ID, Key ID, and the .p8.
#    Name of the key as saved in Codemagic > Settings > Integrations:  CoinSights
#    (must match `integrations.app_store_connect` below).
#
# 3. Push, then start a build on "iOS release (TestFlight)". The "Set up code
#    signing" step creates the App ID, the iOS Distribution certificate and the
#    App Store provisioning profile via the API key — nothing to pre-upload.
#    NOTE: there is NO `ios_signing:` block on purpose — that block makes
#    Codemagic look for a pre-uploaded profile and fail before scripts run.
#    Apple caps you at 3 distribution certificates; if the create step ever
#    says "maximum number of certificates", delete an unused one at
#    developer.apple.com → Certificates.
#
#    The certificate's private key (IOS_DIST_CERT_KEY_BASE64, in the
#    coinsights_secrets group) is generated ONCE and reused by every build —
#    see "Signing 2/4" below. Without this, every build would generate a new
#    key and ask Apple to CREATE a new Distribution certificate, hitting the
#    cert cap after a few runs. If IOS_DIST_CERT_KEY_BASE64 is ever rotated,
#    the next build's --create will mint a fresh certificate for it.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  # ─────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CoinSights      # name of the key in Codemagic > Settings > Integrations > Developer Portal
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
      groups:
        - coinsights_secrets   # REVENUECAT_API_KEY_IOS/ANDROID, GOOGLE(SERVICE)_*_BASE64
    scripts:
      - name: Set up Firebase config
        script: |
          echo "$GOOGLESERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine > test-results/flutter.json
        test_report: test-results/flutter.json

      - name: "Signing 1/4 — init keychain"
        script: keychain initialize

      - name: "Signing 2/4 — generate certificate private key"
        script: |
          set -ex
          # Reuse the SAME key across builds (IOS_DIST_CERT_KEY_BASE64, secure
          # env var) instead of generating a fresh one every run. A fresh key
          # each build meant every build asked Apple to CREATE a brand new
          # Distribution certificate, which eventually hits Apple's cert cap
          # and fails with "You already have a current Distribution
          # certificate". With a persisted key, fetch-signing-files (below)
          # finds the existing certificate tied to it and just reuses it.
          if [ -n "$IOS_DIST_CERT_KEY_BASE64" ]; then
            echo "$IOS_DIST_CERT_KEY_BASE64" | base64 --decode > "$CM_BUILD_DIR/cert_key"
          else
            ssh-keygen -t rsa -b 2048 -m PEM -f "$CM_BUILD_DIR/cert_key" -q -N ""
          fi
          ls -l "$CM_BUILD_DIR/cert_key"

      - name: "Signing 3/4 — create cert + App ID + App Store profile"
        script: |
          set -ex
          # --create makes the App ID, the Apple Distribution certificate (from
          # the key generated above) and the App Store provisioning profile if
          # they don't exist. Requires the API key role App Manager or Admin.
          app-store-connect fetch-signing-files "com.cognizeapp.coinsights" \
            --type IOS_APP_STORE \
            --platform IOS \
            --certificate-key "@file:$CM_BUILD_DIR/cert_key" \
            --create \
            --verbose

      - name: "Signing 4/4 — install cert + wire profile into Xcode"
        script: |
          set -ex
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          # $BUILD_NUMBER is Codemagic's per-workflow incrementing counter —
          # every TestFlight upload needs a higher build number than the last.
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=ENABLE_FIREBASE=true \
            --dart-define=ENABLE_REVENUECAT=true \
            --dart-define=REVENUECAT_API_KEY_IOS=$REVENUECAT_API_KEY_IOS
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Fill these in once you want App Store review submitted automatically:
        # submit_to_app_store: false

  # ─────────────────────────────────────────────────────────────────────────
  ios-workflow:
    name: iOS build & test (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine --coverage > test-results/flutter.json
        test_report: test-results/flutter.json

      - name: Build unsigned iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - coverage/lcov.info

  # ─────────────────────────────────────────────────────────────────────────
  android-workflow:
    name: Android build & test
    max_build_duration: 45
    # No instance_type set — linux_x2 isn't included on the free plan, and
    # Codemagic falls back to whatever Linux instance the plan does include.
    environment:
      flutter: 3.29.3
      groups:
        - coinsights_secrets
    scripts:
      - name: Set up Firebase config
        script: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine --coverage > test-results/flutter.json
        test_report: test-results/flutter.json

      # NOTE: release builds are currently debug-signed unless android/key.properties
      # is supplied (it's gitignored — see android/app/build.gradle.kts). Add it as a
      # secure env var / encrypted file here before shipping to Google Play.
      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=ENABLE_FIREBASE=true \
            --dart-define=ENABLE_REVENUECAT=true \
            --dart-define=REVENUECAT_API_KEY_ANDROID=$REVENUECAT_API_KEY_ANDROID

      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=ENABLE_FIREBASE=true \
            --dart-define=ENABLE_REVENUECAT=true \
            --dart-define=REVENUECAT_API_KEY_ANDROID=$REVENUECAT_API_KEY_ANDROID
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - coverage/lcov.info
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
