# Codemagic CI/CD — Coinsights
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
#   • ios-release      → SIGNED .ipa, uploaded to App Store Connect / TestFlight
#   • ios-workflow     → unsigned .app  (fast PR check: analyze + test + compile)
#   • android-workflow → release .apk + .aab (debug-signed, for testing only)
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP for ios-release (~5 min):
#
# 1. App Store Connect → Users and Access → Integrations → App Store Connect API
#    → generate a TEAM key with the "App Manager" role (Admin also works;
#    "Developer" does NOT — it can't create certificates/profiles).
#    Download the .p8 once. Note the Issuer ID and the Key ID.
#
# 2. Codemagic → (top-right avatar) Team/Personal settings → Integrations →
#    App Store Connect → Connect. Paste Issuer ID, Key ID, and the .p8.
#    Name the integration exactly:  AppStoreConnect
#    (must match `integrations.app_store_connect` below).
#
# 3. Push, then start a build on "iOS release (TestFlight)". The "Set up code
#    signing" step creates the App ID, the iOS Distribution certificate and the
#    App Store provisioning profile via the API key — nothing to pre-upload.
#    NOTE: there is NO `ios_signing:` block on purpose — that block makes
#    Codemagic look for a pre-uploaded profile and fail before scripts run.
#    Apple caps you at 3 distribution certificates; if the create step ever
#    says "maximum number of certificates", delete an unused one at
#    developer.apple.com → Certificates.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  # ─────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppStoreConnect      # the integration name from step 2
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine > test-results/flutter.json
        test_report: test-results/flutter.json

      - name: Set up code signing
        script: |
          set -ex
          keychain initialize
          KEY="$CM_BUILD_DIR/cert_key"

          # Private key backing the iOS Distribution certificate.
          ssh-keygen -t rsa -b 2048 -m PEM -f "$KEY" -q -N ""

          # Create the iOS Distribution certificate (ignored if the account
          # already has the max of 3 — then delete an unused one in the Apple
          # Developer portal and re-run).
          app-store-connect create-certificate \
            --type IOS_DISTRIBUTION \
            --certificate-key "@file:$KEY" \
            --save || true

          # Register the App ID if missing and create the App Store
          # provisioning profile for it. Needs the API key role to be
          # "App Manager" or "Admin".
          app-store-connect fetch-signing-files "com.cognizeapp.coinsights" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$KEY" \
            --create

          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          # $BUILD_NUMBER is Codemagic's per-workflow incrementing counter —
          # every TestFlight upload needs a higher build number than the last.
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Fill these in once you want App Store review submitted automatically:
        # submit_to_app_store: false

  # ─────────────────────────────────────────────────────────────────────────
  ios-workflow:
    name: iOS build & test (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine --coverage > test-results/flutter.json
        test_report: test-results/flutter.json

      - name: Build unsigned iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - coverage/lcov.info

  # ─────────────────────────────────────────────────────────────────────────
  android-workflow:
    name: Android build & test
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: 3.29.3
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine --coverage > test-results/flutter.json
        test_report: test-results/flutter.json

      # NOTE: release builds are currently debug-signed (see
      # android/app/build.gradle.kts). Add a real keystore + the
      # `android_signing` reference here before shipping to Google Play.
      - name: Build APK
        script: flutter build apk --release

      - name: Build App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - coverage/lcov.info
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
