# Codemagic CI/CD — Coinsights
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
#
#   • ios-release      → SIGNED .ipa, uploaded to App Store Connect / TestFlight
#   • ios-workflow     → unsigned .app  (fast PR check: analyze + test + compile)
#   • android-workflow → release .apk + .aab (debug-signed, for testing only)
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP for ios-release (all in the Codemagic UI + Apple, ~10 min):
#
# 1. App Store Connect → Users and Access → Integrations → App Store Connect API
#    → generate a team key with the "App Manager" role. Download the .p8 once.
#    Note the Issuer ID and the Key ID.
#
# 2. Codemagic → (top-right avatar) Team/Personal settings → Integrations →
#    App Store Connect → Connect. Paste Issuer ID, Key ID, and the .p8.
#    Give the integration the name:  AppStoreConnect
#    (must match `integrations.app_store_connect` below — change both if you
#    name it differently).
#
# 3. Apple Developer → Certificates, Identifiers & Profiles → Identifiers:
#    confirm the App ID  com.cognizeapp.coinsights  exists (it does if the app
#    is already in App Store Connect). Codemagic creates the distribution
#    certificate + provisioning profile automatically from the API key.
#
# 4. Push this file, then in Codemagic start a build on the "iOS release
#    (TestFlight)" workflow. The build appears in App Store Connect →
#    TestFlight in ~15 min (first processing can take up to an hour).
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  # ─────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AppStoreConnect      # the integration name from step 2
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cognizeapp.coinsights
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine > test-results/flutter.json
        test_report: test-results/flutter.json

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          # Registers the App ID if missing, creates an iOS Distribution
          # certificate if the team has none, and creates the App Store
          # provisioning profile — then installs them for the build.
          # Needs the API key role to be "App Manager" or "Admin".
          app-store-connect fetch-signing-files "com.cognizeapp.coinsights" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          # $BUILD_NUMBER is Codemagic's per-workflow incrementing counter —
          # every TestFlight upload needs a higher build number than the last.
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Fill these in once you want App Store review submitted automatically:
        # submit_to_app_store: false

  # ─────────────────────────────────────────────────────────────────────────
  ios-workflow:
    name: iOS build & test (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.29.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine --coverage > test-results/flutter.json
        test_report: test-results/flutter.json

      - name: Build unsigned iOS
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - coverage/lcov.info

  # ─────────────────────────────────────────────────────────────────────────
  android-workflow:
    name: Android build & test
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: 3.29.3
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: |
          mkdir -p test-results
          flutter test --machine --coverage > test-results/flutter.json
        test_report: test-results/flutter.json

      # NOTE: release builds are currently debug-signed (see
      # android/app/build.gradle.kts). Add a real keystore + the
      # `android_signing` reference here before shipping to Google Play.
      - name: Build APK
        script: flutter build apk --release

      - name: Build App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - coverage/lcov.info
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
